<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cisco Secure Firewall Toolkit</title>
<style>
:root{
  --a:#17a2d4;--ad:#0b6f99;--bg:#0d1117;--b2:#161b22;--b3:#202734;--br:#303a48;
  --t:#e6edf3;--t2:#a7b2bf;--t3:#6f7e8e;--g:#3fb950;--y:#d29922;--r:#f85149;
  --panel:linear-gradient(180deg,rgba(22,27,34,.96),rgba(13,18,25,.98));
  --chrome:linear-gradient(180deg,rgba(20,35,49,.98),rgba(13,20,29,.98));
  --rail:linear-gradient(180deg,rgba(17,27,39,.98),rgba(10,16,24,.98));
  --wall:radial-gradient(circle at 14% 10%,rgba(23,162,212,.16),transparent 28%),
         radial-gradient(circle at 88% 12%,rgba(63,185,80,.08),transparent 26%),
         linear-gradient(135deg,#0d1117 0%,#08121d 100%);
  --shadow:0 14px 30px rgba(0,0,0,.28);
  --radius:8px;
  --mono:Consolas,"Courier New",monospace;
}
[data-theme="light"]{
  --a:#0369a1;--ad:#075985;--bg:#f6f8fb;--b2:#ffffff;--b3:#eef3f8;--br:#d5dee8;
  --t:#152033;--t2:#4b5b6d;--t3:#8492a3;--g:#16803b;--y:#a35f00;--r:#c62828;
  --panel:linear-gradient(180deg,#ffffff,#f7f9fb);--chrome:linear-gradient(180deg,#ffffff,#eef4f8);
  --rail:linear-gradient(180deg,#f8fbfd,#edf4f8);
  --wall:radial-gradient(circle at 14% 10%,rgba(3,105,161,.10),transparent 28%),
         radial-gradient(circle at 88% 12%,rgba(22,128,59,.07),transparent 26%),
         linear-gradient(135deg,#f8fafc 0%,#edf4f8 100%);
  --shadow:0 12px 24px rgba(15,23,42,.10);
}
*{box-sizing:border-box}
body{margin:0;width:100vw;height:100vh;overflow:hidden;background:var(--wall);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
.shell{height:100vh;display:flex;flex-direction:column}
.tbar{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--chrome);border-bottom:1px solid rgba(23,162,212,.28);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.dot.r{background:#ff5f57}.dot.y{background:#ffbd2e}.dot.g{background:#28c840}
.title{font-family:var(--mono);font-size:14px;font-weight:800;letter-spacing:.02em}.title span{color:var(--a)}
.version{margin-left:auto;color:var(--t3);font-family:var(--mono);font-size:11px}
.theme{border:1px solid var(--br);background:var(--b3);color:var(--t2);border-radius:18px;padding:4px 10px;font-size:11px;cursor:pointer}
.kbar{display:flex;align-items:center;gap:9px;padding:8px 16px;background:var(--rail);border-bottom:1px solid rgba(23,162,212,.20)}
.kbar label{font-size:12px;color:var(--t2);white-space:nowrap}
.kbar input{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--br);border-radius:6px;color:var(--t);padding:7px 10px;font-family:var(--mono);font-size:12px;outline:none}
.kbar input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(23,162,212,.12)}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:0;flex:1}
.sidebar{background:var(--rail);border-right:1px solid rgba(23,162,212,.25);padding:9px 8px;overflow:auto}
.slbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);font-weight:800;padding:10px 9px 5px}
.cb{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:0;color:var(--t2);padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px}
.cb:hover{background:var(--b3);color:var(--t)}
.cb.active{background:rgba(23,162,212,.15);color:var(--a);font-weight:800;border-left:2px solid var(--a);padding-left:7px}
.ic{width:18px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--a)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:8px;overflow:auto;padding:9px 12px;background:var(--chrome);border-bottom:1px solid rgba(23,162,212,.22)}
.tab{flex:none;border:1px solid transparent;background:transparent;color:var(--t2);border-radius:7px;padding:7px 11px;cursor:pointer;font-size:11px;min-height:32px}
.tab:hover{background:rgba(255,255,255,.045);color:var(--t);border-color:rgba(255,255,255,.08)}
.tab.active{background:linear-gradient(180deg,rgba(23,162,212,.24),rgba(23,162,212,.09));border-color:rgba(23,162,212,.35);color:var(--t);font-weight:800}
.content{flex:1;overflow:auto;padding:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:14px;margin-bottom:14px}
.cblock{background:var(--panel);border:1px solid var(--br);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.chdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border-bottom:1px solid rgba(23,162,212,.18);background:linear-gradient(180deg,rgba(255,255,255,.035),transparent)}
.chdr-l{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.cbody{padding:13px 14px;color:var(--t2);font-size:12.5px;line-height:1.68}
.stitle{font-size:16px;font-weight:900;color:var(--t)}
.small{font-size:11px;color:var(--t3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.quick-card{background:var(--panel);border:1px solid var(--br);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.quick-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);border:0;border-bottom:1px solid rgba(23,162,212,.18);color:var(--t);padding:11px 13px;text-align:left;cursor:pointer}
.quick-head:hover{background:rgba(23,162,212,.08)}
.quick-title{font-size:13px;font-weight:900;color:var(--t)}
.quick-desc{font-size:11px;color:var(--t3);margin-top:3px;line-height:1.35}
.quick-meta{display:flex;align-items:center;gap:6px;flex:none}
.quick-body{display:none;padding:6px 13px 12px}
.quick-card.open .quick-body{display:block}
.quick-card.open .quick-head{border-bottom-color:rgba(23,162,212,.34)}
.metric{background:var(--b2);border:1px solid var(--br);border-radius:8px;padding:12px}
.metric b{display:block;color:var(--t);font-size:13px;margin-bottom:5px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--br);background:var(--b3);border-radius:20px;padding:4px 9px;margin:3px 4px 3px 0;font-size:11px;color:var(--t2)}
.badge{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:900;white-space:nowrap;border:1px solid}
.ro{color:var(--g);background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.30)}
.caution{color:var(--y);background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.32)}
.danger{color:var(--r);background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.34)}
.cmdrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;border-bottom:1px solid var(--br);padding:8px 0}
.cmdrow:last-child{border-bottom:0}
.cmd{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.cmd.ro{color:var(--g);background:transparent;border:0;padding:0}.cmd.caution{color:var(--y);background:transparent;border:0;padding:0}.cmd.danger{color:var(--r);background:transparent;border:0;padding:0}
.why{font-size:11.5px;color:var(--t3);margin-top:3px}
.mode{display:inline-block;margin-top:5px;font-size:10.5px;color:var(--t2);border:1px solid var(--br);background:var(--bg);border-radius:4px;padding:2px 6px;font-family:var(--mono)}
.copybtn{border:1px solid var(--br);background:var(--b3);color:var(--t2);border-radius:5px;padding:4px 9px;font-size:11px;cursor:pointer}
.copybtn:hover{border-color:var(--a);color:var(--a)}
.note{border-left:3px solid var(--a);background:rgba(23,162,212,.08);padding:9px 11px;border-radius:5px;margin:8px 0;color:var(--t2)}
.warn{border-left:3px solid var(--y);background:rgba(210,153,34,.08);padding:9px 11px;border-radius:5px;margin:8px 0;color:var(--t2)}
.alert{border-left:3px solid var(--r);background:rgba(248,81,73,.08);padding:9px 11px;border-radius:5px;margin:8px 0;color:var(--t2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--br);padding:8px 9px;vertical-align:top}
th{background:var(--b3);color:var(--t);text-align:left}
.flow{display:grid;gap:8px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;background:var(--b2);border:1px solid var(--br);border-radius:8px;padding:10px}
.num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(23,162,212,.16);color:var(--a);font-weight:900;font-family:var(--mono);font-size:12px}
.run-title{font-weight:900;color:var(--t);font-size:13px;margin-bottom:4px}
.run-do{color:var(--t2);font-size:12.5px;line-height:1.55}
.run-next{margin-top:6px;color:var(--t3);font-size:11.5px;border-left:2px solid var(--a);padding-left:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){
  body{overflow:auto;height:auto}.shell{height:auto;min-height:100vh}.layout{grid-template-columns:1fr}.sidebar{max-height:220px;border-right:0;border-bottom:1px solid rgba(23,162,212,.25)}
  .hero,.two{grid-template-columns:1fr}.content{padding:12px}.title{font-size:12px}.version{display:none}
}
</style>
</head>

</div>

      <button class="metric" onclick="openModule('ips',0)"><b>04 Security Services</b>IPS/Snort, URL, file, malware, TLS, identity, ISE, remote access.</button>
      <button class="metric" onclick="openModule('cli',0)"><b>05 Operations</b>CLI modes, health checks, logging, backups, upgrades, automation.</button>
      <button class="metric" onclick="openModule('trouble',0)"><b>06 Troubleshooting</b>Decision tree, internet, servers, NAT, policy, VPN, DNS, drops, HA.</button>
      <button class="metric" onclick="openModule('cloud',0)"><b>07 Ecosystem</b>Cloud, virtual firewall, containers, SD-WAN, and migrations.</button>
      <button class="metric" onclick="openModule('labs',0)"><b>08 Practice</b>Beginner, engineer, pro, and enterprise labs.</button>
      <button class="metric" onclick="openModule('quick',0)"><b>09 Reference</b>Readable command bundles, CLI modes, GUI map, safety colors, sources.</button>
    </div>
    <div class="warn">Every command includes a safety color and the CLI mode where the command should be typed.</div>`
  },
  {
    title:"Firewall mental model",
    body:`<div class="grid">
      <div class="metric"><b>FMC</b>Central manager for multiple firewalls. Use it for enterprise policy, events, backups, upgrades, and reporting.</div>
      <div class="metric"><b>FDM</b>Local web GUI on a single firewall. Good for branch, small business, and labs.</div>
      <div class="metric"><b>CLI</b>Best for setup, checking health, packet-tracer, captures, and emergency recovery.</div>
      <div class="metric"><b>FTD</b>Firewall Threat Defense software: firewall plus next-generation security inspection.</div>
    </div><div class="note">If a device is managed by FMC or FDM, do normal policy work in the GUI. CLI is mainly for verification and troubleshooting.</div>`
  },
  {
    title:"Study plan and learning options",
    body:`<div class="cblock"><div class="chdr"><div class="chdr-l">Choose how you want to learn</div><span class="badge ro">learning paths</span></div><div class="cbody">
      Do not use the same path for every learner. A beginner needs concepts and GUI practice first; an operator needs CLI and troubleshooting; a future engineer needs design, policy, VPN, security services, and change control.
      <div class="note"><b>Best order for a new learner:</b> Beginner foundation, GUI builder, CLI operator, troubleshooting, security services, cloud/migration, then labs.</div>
    </div></div>
    <div class="grid">
      <button class="metric" onclick="openModule('start',1)"><b>Beginner foundation</b>Open the mental model tab, draw inside/outside/DMZ/management, then trace one packet through route, NAT, policy, and inspection.</button>
      <button class="metric" onclick="openModule('gui',0)"><b>GUI builder path</b>Open FMC/FDM workflows, create interfaces, routes, NAT, access rules, deploy changes, then prove the match in events.</button>
      <button class="metric" onclick="openModule('cli',0)"><b>CLI operator path</b>Use the CLI Toolkit tab to enter the right mode, run read-only checks, packet-tracer, captures, health checks, and safe caution commands.</button>
      <button class="metric" onclick="openModule('policy',0)"><b>Policy engineer path</b>Build objects, access control, logging, rule order, IPS inspection, URL, file, malware, and TLS policy.</button>
      <button class="metric" onclick="openModule('vpn',0)"><b>VPN engineer path</b>Build and troubleshoot site-to-site VPN, remote access VPN, certificates, NAT exemption, and split tunnel.</button>
      <button class="metric" onclick="openModule('trouble',0)"><b>Troubleshooter path</b>Diagnose internet, server publishing, NAT, policy, VPN, DNS, drops, high CPU, HA, and GUI issues.</button>
      <button class="metric" onclick="openModule('cloud',0)"><b>Cloud and migration path</b>Follow the ordered cloud and migration runbooks, map interfaces/zones, rebuild policy/NAT/VPN, then validate top flows before cutover.</button>
      <button class="metric" onclick="openModule('labs',0)"><b>Hands-on lab path</b>Practice beginner, engineer, pro, and enterprise tasks until you can build and prove each result without guessing.</button>
    </div>
    ${runbook("30-day Cisco Secure Firewall learning path",[
      ["Days 1-5: Network and firewall basics","Write a small IP plan: client subnet, server subnet, outside next hop, DNS server, and management IP. Draw inside, outside, DMZ, and management. Then trace one TCP/443 flow and label where route lookup, NAT, access rule, and inspection happen.","Build a small lab diagram and continue only when you can explain how one client reaches one server through a firewall."],
      ["Days 6-10: First firewall build","In FMC/FDM set management IP, DNS, NTP, license, inside/outside interfaces, security zones, default route, internal route, dynamic PAT, and one inside-to-outside access rule with logging enabled.","Deploy the policy and prove internet access with packet-tracer, connection events, and a real client test."],
      ["Days 11-15: Real policy and NAT work","Create reusable network/service objects, publish one DMZ server with static NAT, add a narrow outside-to-DMZ rule, enable logging, and understand rule order.","Test from outside to inside with packet-tracer and events, then document the matching NAT rule and access rule."],
      ["Days 16-20: VPN skills","Build a site-to-site VPN with matching proposals, protected networks, NAT exemption, routes, and access rules. Then build a remote access VPN plan with users, pool, DNS, split tunnel, and certificate basics.","Generate traffic and verify VPN sessions, IKE/IPsec counters, packet-tracer, NAT exemption, and one real application flow."],
      ["Days 21-25: Troubleshooting skills","Practice a repeatable order: define symptom, collect five-tuple, check route, NAT, policy, inspection, logs, then captures. Break and fix internet, DNS, server, VPN, and policy issues in a lab.","For each issue, save the evidence that proves the cause instead of only saying it works now."],
      ["Days 26-30: Professional operations","Day 26: in FMC go to Policies > Intrusion and apply a balanced IPS policy to one access rule, then check Analysis > Intrusions. Day 27: create URL and file policies, attach them to one web rule, download a safe test file, and check URL/File events. Day 28: design TLS decryption with bypass categories and test only a pilot user group. Day 29: configure identity or VPN user mapping, then verify the user field appears in connection events. Day 30: take an FMC backup, review upgrade readiness, send logs to syslog/SIEM, test one read-only FMC API call, and write a change plan with rollback.","Finish only when you can show evidence for each item: IPS event, URL/File event, TLS bypass/decrypt result, user identity match, backup file, health/upgrade check, SIEM log, API output, and rollback notes."]
    ])}
    ${runbook("How to practice the professional operations topics",[
      ["IPS / Snort practice","Open FMC > Policies > Access Control. Edit one lab allow rule and attach an Intrusion Policy such as Balanced Security and Connectivity. Deploy. Generate allowed test traffic, then open Analysis > Intrusions and filter by source/destination/time. Do not start with aggressive blocking in production.","Next: tune one noisy event by making a narrow exception, not by disabling the whole IPS policy."],
      ["URL filtering practice","Open FMC > Policies > Access Control. On a web rule, add URL categories or reputation controls. Start with monitor/logging or block only clearly risky categories. Deploy, browse to test websites, then check Analysis > Connections for URL category and action.","Next: create one business exception for a specific group or destination and prove the exception matched."],
      ["File and malware practice","Create or edit a File Policy, choose protocols and file types to detect first, then attach it to an access rule. Download a safe test file through the firewall and check Analysis > Files and Analysis > Malware for filename, SHA, disposition, and action.","Next: change only one file type from detect to block in the lab and verify the user experience plus event record."],
      ["TLS decryption practice","Plan certificates before enabling it. Create or import an internal CA, define bypass for banking, healthcare, certificate pinning, and critical apps, then apply TLS policy only to a pilot source network. Monitor decrypt errors and CPU.","Next: document which traffic is decrypted, which traffic is bypassed, and which applications failed during pilot."],
      ["Identity practice","Connect the identity source such as AD/ISE/VPN realm, confirm NTP time sync, then create one user-based access rule. Generate traffic from that user and check Analysis > Connections for the user and rule name.","Next: test an unknown user case and keep a non-identity fallback rule for critical infrastructure."],
      ["Backup and upgrade practice","In FMC, create a backup before major changes and store it outside FMC. Before upgrade, read release notes, confirm FMC/FTD compatibility, run health checks, clear failed deployments, and define validation tests.","Next: write rollback criteria before the upgrade: when to continue, when to pause, and when to revert."],
      ["Logging and SIEM practice","Configure syslog or event forwarding with correct severity, timestamp, hostname, and facility. Generate one allow, one block, one VPN login, and one admin change, then confirm they appear in the SIEM with correct fields.","Next: build a small dashboard for blocked traffic, VPN logins, IPS hits, and deployment/admin changes."],
      ["API practice","Start read-only. Use FMC API to list domains, devices, objects, or policies. Do not automate deploys first. Save the output and compare object names and UUIDs with the GUI.","Next: create a dry-run plan for any future write automation so the change can be reviewed before deployment."],
      ["Change and rollback practice","Write the change goal, affected firewall, exact policy/rule/object changes, test plan, maintenance window, backup location, rollback steps, and owner approval. After deployment, attach screenshots/events/commands as evidence.","Next: close the change only after business validation is complete and rollback is no longer needed."]
    ])}
    ${table(["Learning option","Use this when","You should be able to do"],[
      ["GUI-first","You are new or responsible for daily FMC/FDM policy work.","Create zones, interfaces, routes, NAT, access rules, deploy changes, and prove rule matches in events."],
      ["CLI-first","You support outages or need confidence at the console.","Use the correct CLI mode, run safe checks, packet-tracer, captures, health commands, and collect evidence."],
      ["Troubleshooting-first","Users report broken applications, VPN, DNS, NAT, drops, or slowness.","Follow a decision tree and identify the first failing phase without random changes."],
      ["Security-services","You manage IPS, URL, file, malware, TLS, identity, or ISE integration.","Enable controls carefully, monitor impact, tune exceptions, and avoid breaking business traffic."],
      ["Cloud/migration","You deploy virtual firewalls or replace ASA/FortiGate/Palo Alto.","Follow ordered deployment/migration steps with validation and rollback evidence."],
      ["Job-ready","You want professional engineer behavior, not only configuration memory.","Document designs, change plans, validation, backups, rollback, and operational handover."]
    ])}`
  }
 ],
 platforms:[
  {title:"Cisco Secure Firewall families",body:table(["Family","Typical place","Engineer notes"],[
    ["Firepower 1000","Small business, branch, edge","1010/1120/1140/1150. Good learning platform for FMC or FDM."],
    ["Secure Firewall 1200 / 200","Newer branch options","Compact current portfolio choices for distributed sites."],
    ["Secure Firewall 3100","Medium enterprise","Common campus/edge platform, usually FMC-managed."],
    ["Secure Firewall 4200","Large campus and data center","4215/4225/4245. Higher throughput and clustering options."],
    ["Secure Firewall 6100","Ultra-high-end data center","High performance density for large data center and telecom use."],
    ["Virtual / cloud","Private cloud and public cloud","Same firewall concepts, but interface mapping depends on platform."]
  ])},
  {title:"Management methods",body:`<div class="grid"><div class="metric"><b>Use FMC when...</b>You have multiple firewalls, central rules, central events, HA, enterprise change control, and reporting.</div><div class="metric"><b>Use FDM when...</b>You manage one firewall locally and need a simpler GUI.</div><div class="metric"><b>Use CLI when...</b>You need initial setup, packet-tracer, health checks, captures, or recovery.</div></div>`},
  {title:"Licensing checklist",body:steps([
    "Base firewall functions: In FMC/FDM open licensing or Smart Licensing and confirm the device is registered and base firewall functions are active.",
    "Threat/IPS subscription: Confirm Threat license before attaching intrusion policy to access rules.",
    "Malware/file inspection: Confirm Malware license before creating file policy or expecting malware disposition events.",
    "URL filtering: Confirm URL license and cloud connectivity before using URL categories or reputation in rules.",
    "Remote access VPN licensing: Confirm Secure Client/RA VPN licensing, user count, and entitlement before production rollout.",
    "Cisco account and Smart Licensing reachability: Confirm FMC/firewall can reach the required Cisco licensing services through DNS, route, and access policy."
  ])}
 ],
 design:[
  {title:"Routed firewall mode",body:`<div class="grid"><div class="metric"><b>Use when</b>The firewall is the Layer 3 gateway or routed hop between networks.</div><div class="metric"><b>Common design</b>inside, outside, DMZ, guest, VPN, server, management zones.</div><div class="metric"><b>Engineer focus</b>Routes, NAT, access policy, asymmetric routing, and default gateway placement.</div></div><div class="note">Most Firepower/FTD deployments are routed mode because it is easy to understand and troubleshoot.</div>`},
  {title:"Transparent firewall mode",body:`<div class="grid"><div class="metric"><b>Use when</b>You need inline filtering without changing IP gateways.</div><div class="metric"><b>Common design</b>Bridge groups between switch/router segments.</div><div class="metric"><b>Engineer focus</b>MAC learning, bridge groups, BVI management, allowed EtherTypes, and bypass plan.</div></div><div class="warn">Transparent mode is powerful but less obvious to beginners. Document the physical path carefully.</div>`},
  {title:"Zones and segmentation",body:table(["Zone","Typical members","Policy idea"],[
    ["outside","internet-facing interface","Permit only published services and VPN."],
    ["inside","users and trusted LAN","Allow business apps, inspect web/file traffic."],
    ["dmz","public servers","Allow only required inbound and outbound flows."],
    ["guest","guest Wi-Fi","Internet only, no internal access."],
    ["vpn","remote access pool or tunnel networks","Least privilege to apps, not full LAN by default."],
    ["management","admin networks","Firewall/FMC access only from trusted admin systems."]
  ])},
  {title:"Multi-instance thinking",body:steps(["Use only when the platform and license support it.","Separate tenants or security domains before you separate small use cases.","Plan resource allocation, interfaces, management, backups, and upgrade ownership.","Keep a clear owner for each instance and avoid shared undocumented dependencies."])}

 platformops:[
  {title:"Chassis and platform checks",body:`<div class="note">Some larger Cisco Secure Firewall platforms include FXOS/chassis concepts below the FTD application. Small 1000-series deployments feel simpler; data center platforms require more platform awareness.</div>`+cmdBlock(commandSets.platform)},
  {title:"Interface module planning",body:steps(["Confirm interface types: copper, SFP/SFP+, QSFP, breakout, management, HA, or data.","Map every cable to switch port, VLAN, speed, duplex, and zone.","For port-channels, confirm LACP mode and switch-side bundle.","For high availability, keep interface naming and cabling symmetric."])},
  {title:"Resource profiles",body:steps(["Document expected throughput, VPN users, TLS decryption, IPS policy, and connection count.","Avoid enabling every inspection feature blindly; performance depends on traffic mix.","Use health policy and FMC dashboards to track load after each major feature is enabled.","For multi-instance or clustering, reserve capacity for failover and growth."])},
  {title:"Platform health",body:cmdBlock(commandSets.platform.concat(commandSets.upgrade.slice(3,6)))}

 ha:[
  {title:"Failover design",body:steps(["Use matching models, compatible software, licenses, interfaces, and modules.","Connect failover/state links according to Cisco design guidance.","Mirror interface names, zones, IP addressing pattern, routes, NAT, and policies.","Test failover during a window before production reliance.","Document normal active unit and recovery decision process."])+cmdBlock(commandSets.ha)},
  {title:"Clustering design",body:steps(["Use clustering for large-scale throughput and resiliency where supported.","Plan control link, data interfaces, switch design, spanned or individual interfaces, and traffic symmetry.","Understand that cluster troubleshooting is more complex than simple HA.","Before enabling clustering, confirm application behavior, VPN limitations, NAT behavior, and upgrade process for your version."])},
  {title:"HA checks",body:cmdBlock(commandSets.ha.slice(0,5).concat(commandSets.cliHealth.slice(3,9)))},
  {title:"Failover runbook",body:`<div class="alert"><b>Do not improvise HA changes.</b> Use a written runbook during a maintenance window.</div>`+steps(["Confirm both units healthy.","Save/export configuration and FMC backup.","Record active/standby roles and interface state.","Notify stakeholders.","Force failover only if required.","Verify traffic, VPN, NAT, routes, and critical apps.","If failed, revert role and escalate with collected evidence."])+cmdBlock(commandSets.ha)}
 ],
 setup:[
  {title:"Console setup checklist",body:steps(["Connect console cable and management cable.","Record model, serial, software version, management IP plan, inside/outside/DMZ design.","Configure management IP, gateway, DNS, NTP, hostname.","Decide FMC or FDM before building policies.","Back up after first working deployment."])+cmdBlock(commandSets.setup)},
  {title:"Register to FMC",body:steps(["In FTD CLI, add FMC manager with registration key.","In FMC, go to Devices > Device Management > Add Device.","Enter management IP, registration key, access control policy, license, and device group.","Wait for registration, then configure interfaces, routes, NAT, and policies.","Deploy and verify."])+cmdBlock(commandSets.setup.slice(0,6))},
  {title:"FDM first login",body:steps(["Open browser to the firewall management IP.","Complete setup wizard: admin password, time, DNS, outside, inside, and licensing.","Build basic route, NAT, and access control.","Deploy changes.","Run packet-tracer or GUI packet trace to verify."])}
 ],
 gui:[
  {title:"FMC workflow",body:steps(["Devices > Device Management: add or edit firewall.","Interfaces: enable ports, assign names, zones, and IP addresses.","Routing: add default/static/dynamic routing.","Objects: build reusable networks, hosts, ports, URLs, and zones.","Policies > Access Control: create rules from specific to broad.","Deploy: review pending changes and push to device.","Analysis: use connection and intrusion events for proof."])},
  {title:"FDM workflow",body:steps(["Device > Interfaces: configure inside/outside/DMZ.","Device > Routing: configure default route and internal routes.","Policies > NAT: dynamic PAT or static NAT.","Policies > Access Control: allow required traffic only.","Monitoring: check events and packet trace.","Deploy: confirm the change list before commit."])},
  {title:"Deploy discipline",body:`<div class="warn"><b>Deployment is the commit.</b> In FMC/FDM, a saved rule is not active until deployed.</div>${steps(["Read the change summary.","Confirm affected device.","Confirm policy name and rule order.","Deploy during approved window for risky changes.","After deploy, test with real traffic and event logs."])}`}
 ],
 config:[
  {title:"Create firewall access policy rule",body:`<div class="note"><b>Use this for daily permit/block requests.</b> Example: allow inside users to an internal app, allow DMZ server to DNS, or block a bad host.</div>`+runbook("FMC access rule build order",[
    ["Collect the request","Write the source IP/subnet or user group, destination IP/FQDN, protocol/port, application name, business owner, change window, and expiry date. Example: source NET_INSIDE_USERS to HOST_APP01 TCP/443.","Create objects next so the rule is readable and reusable."],
    ["Create objects","In FMC open Objects > Object Management. Create Network objects such as NET_INSIDE_USERS and HOST_APP01, and Port objects such as SVC_HTTPS_TCP_443. Add descriptions with ticket number and owner.","After objects exist, open the access policy."],
    ["Open the correct access policy","Go to Policies > Access Control, edit the policy assigned to the firewall, and choose Add Rule. Confirm the target firewall uses this policy under Devices > Device Management.","Build the rule conditions next."],
    ["Fill rule conditions","Set Action Allow or Block. Set Source Zone, Destination Zone, Source Networks/Users, Destination Networks, Ports, Applications or URLs if needed. Keep conditions specific; avoid any-any except emergency containment.","Enable logging before saving."],
    ["Enable logging and inspection","On the rule, enable Log at End of Connection. Attach IPS/File/URL/TLS policy only if required and licensed. Put the rule above broader allows and below emergency blocks.","Save and review rule order."],
    ["Deploy and validate","Click Deploy, review pending changes, deploy to the correct device, then test from the real source. In Analysis > Connections, filter source/destination/time and confirm the rule name and action.","Document event proof and close the change."]
  ])+cmdBlock([["ro","packet-tracer input inside tcp <src-ip> 50000 <dst-ip> 443 detailed","Diagnostic CLI: simulate the access rule before or after deploy."],["ro","show access-list","Diagnostic CLI: view rule hit evidence where available."],["ro","show conn address <src-ip>","Diagnostic CLI: confirm active sessions from the source."],["ro","show route <dst-ip>","Confirm routing before blaming policy."]])},
  {title:"Create NAT rule",body:`<div class="note"><b>NAT must match the traffic before policy proof makes sense.</b> Build NAT using original source/destination and then verify translation.</div>`+runbook("NAT build order",[
    ["Decide NAT type","Choose Dynamic PAT for inside users to internet, Static NAT for publishing a server, NAT exemption for VPN, or Policy NAT for partner/overlap cases. Record original and translated source/destination.","Create needed objects next."],
    ["Create original and translated objects","In Objects > Object Management create real inside network, real server, public IP, VPN remote network, or translated pool. Name clearly: HOST_DMZ_WEB01_REAL and HOST_DMZ_WEB01_PUBLIC.","Open NAT policy after objects exist."],
    ["Open NAT policy","Go to Devices > NAT or Policies > NAT depending on version. Edit the NAT policy assigned to the firewall. Use Manual NAT when order matters, especially VPN exemption and policy NAT.","Place the rule correctly."],
    ["Build the NAT rule","Set source/destination interface zones, original source/destination, translated source/destination, service if required, and no-proxy-arp/route-lookup options only when the design requires them.","Move specific NAT above broad PAT."],
    ["Add matching access rule","For published servers, access policy normally permits traffic to the real/private destination with the required port. For outbound PAT, allow inside-to-outside services. For VPN exemption, allow VPN networks as needed.","Deploy and test."],
    ["Validate translation","Use packet-tracer, show nat, show xlate, and FMC connection events. Confirm the translated address is exactly what the design requires.","If wrong NAT matches, adjust rule order before changing policy."]
  ])+cmdBlock(commandSets.nat.concat([["caution","clear xlate local <ip-address>","Diagnostic CLI: clear only one host translation while testing NAT changes."]]))},
  {title:"Create site-to-site VPN",body:`<div class="warn"><b>Both peers must match.</b> Most site-to-site failures are mismatch, NAT exemption, route, or wrong protected networks.</div>`+runbook("Site-to-site VPN build order",[
    ["Collect peer information","Get local public IP, peer public IP, local protected networks, remote protected networks, IKE version, encryption, integrity, DH group, lifetime, IPsec proposal, PFS, pre-shared key or certificate, and contact for the peer engineer.","Create objects for all protected networks."],
    ["Create network objects","In Objects > Object Management create local and remote protected network objects. Use names like NET_LOCAL_DC_SERVERS and NET_REMOTE_PARTNER_APP.","Build the VPN topology next."],
    ["Create VPN topology","Go to Devices > VPN > Site To Site. Add a topology, choose route-based or policy-based according to design/version, add local firewall, peer IP, and authentication method.","Configure IKE/IPsec proposals."],
    ["Set IKE and IPsec parameters","Match IKE version, encryption, integrity, DH group, lifetime, IPsec proposal, PFS, and pre-shared key/certificate with the peer. One mismatch can stop the tunnel.","Add protected networks and routes."],
    ["Add protected networks, route, and NAT exemption","Set local/remote networks. Add static route to remote network if required. Create NAT exemption from local protected networks to remote protected networks above internet PAT.","Allow VPN traffic in access policy."],
    ["Create access rules","Permit only required traffic between local and remote VPN networks. Enable logging so every VPN flow can be proven in connection events.","Deploy and generate interesting traffic."],
    ["Bring up and verify","Generate traffic from local protected network to remote protected network. Check IKE/IPsec sessions, encaps/decaps counters, packet-tracer, show nat, show route, and FMC events.","If it fails, compare proposals, NAT exemption, routes, and protected networks first."]
  ])+cmdBlock(commandSets.vpn)},
  {title:"Create remote access VPN",body:`<div class="note"><b>Remote access is a user service.</b> Build identity, pool, DNS, routes, certificate, MFA, and internal access together.</div>`+runbook("Remote access VPN build order",[
    ["Plan the user experience","Choose VPN FQDN, outside interface, certificate, authentication source, MFA method, VPN address pool, DNS servers, split tunnel networks, and allowed applications.","Prepare certificate and identity next."],
    ["Install certificate and identity","Import or generate the VPN certificate and trusted CA chain. Configure AAA/LDAP/RADIUS/SAML/Duo as required. Confirm time sync before testing authentication.","Create VPN policy."],
    ["Create RA VPN policy","In FMC go to Devices > VPN > Remote Access. Select the firewall, outside interface, certificate, authentication method, and address pool.","Create group policy settings next."],
    ["Configure group policy","Set DNS, domain suffix, split tunnel include/exclude, banner, session timeout, client profile, and posture/MFA options if used.","Create access rules for the VPN pool."],
    ["Permit internal applications","In Access Control, allow VPN_POOL to only required internal destinations and ports. Enable logging. Avoid giving full network access by default.","Deploy and pilot."],
    ["Test one pilot user","Connect from outside network, authenticate, confirm assigned VPN IP, DNS, routes, split tunnel behavior, and access to required apps.","Review sessions and logs before broad rollout."]
  ])+cmdBlock(commandSets.vpn.filter(x=>x[1].includes("anyconnect")||x[1].includes("vpn-sessiondb")||x[1].includes("packet-tracer")))},
  {title:"Create objects and groups",body:runbook("Object creation order",[
    ["Define naming standard","Use prefixes: NET_ for subnets, HOST_ for hosts, GRP_ for groups, SVC_ for services, URL_ for URL objects. Include site/app name and avoid vague names like SERVER1.","Search for existing objects next."],
    ["Search before creating","In Objects > Object Management search IP, subnet, FQDN, and service port. Reuse correct existing objects and remove duplicates only through change control.","Create missing objects."],
    ["Create network objects","Create host, network, range, FQDN, URL, or service objects. Add description with owner, ticket, date, and purpose.","Group related objects carefully."],
    ["Create groups","Use groups for readable rules, for example GRP_APP_PAYROLL_SERVERS or GRP_SVC_WEB. Avoid deep nested groups that make troubleshooting hard.","Use objects in policy/NAT/VPN."],
    ["Validate object impact","Before delete or change, check object usage/dependencies in FMC. Changing one shared object can affect many rules.","Document dependencies before deployment."]
  ])+cmdBlock([["ro","GET /api/fmc_config/v1/domain/{domainUUID}/object/networks","FMC API: list network objects before automation."],["ro","GET /api/fmc_config/v1/domain/{domainUUID}/policy/accesspolicies","FMC API: identify policies that may use objects."]])},
  {title:"Configure interfaces and routes",body:runbook("Interface and routing build order",[
    ["Map the cable first","Document firewall interface, switch port, VLAN, IP/subnet, zone, speed/duplex, trunk/access mode, and HA standby IP if used.","Configure interface after the physical map is known."],
    ["Configure interface","In FMC open Devices > Device Management > edit device > Interfaces. Enable interface, set name, zone, IP, VLAN tag/subinterface or port-channel membership, and description.","Deploy or continue to routing depending on workflow."],
    ["Add routes","In device Routing, add default route toward ISP/upstream router and internal routes toward core/distribution. For OSPF/BGP, configure neighbors and filters carefully.","Validate route lookup before NAT/policy."],
    ["Connect switch side","On the switch, match access VLAN, trunk allowed VLANs, LACP, speed, duplex, and MTU. Cabling mismatch creates firewall symptoms that policy cannot fix.","Deploy and test link."],
    ["Verify path","Use show interface ip brief, show interface, show arp, show route <destination>, packet-tracer, and FMC health. Confirm return path from destination side.","Only then build NAT and access rules."]
  ])+cmdBlock([["ro","show interface ip brief","FTD/Diagnostic CLI: interface state and IP summary."],["ro","show interface","Interface counters, errors, drops."],["ro","show arp","Layer 2 neighbor check."],["ro","show route <destination-ip>","Route lookup for destination."],["ro","packet-tracer input inside tcp <src-ip> 50000 <dst-ip> 443 detailed","Full path simulation."]])},
  {title:"Configure logging for rules",body:runbook("Logging build order",[
    ["Decide what must be logged","For business rules log at end of connection. For denies/security events log enough to investigate without creating noise. Avoid debug-level logging permanently.","Enable rule logging next."],
    ["Enable access rule logging","In Access Control rule, enable Log at End of Connection and optionally beginning only when needed for troubleshooting. Include rule names that describe the business purpose.","Configure platform/syslog if needed."],
    ["Send logs to SIEM","In Platform Settings configure syslog destination, severity, facility, timestamp, and hostname. Deploy platform settings to the firewall.","Generate test events."],
    ["Generate evidence","Create one allowed connection, one blocked connection, one VPN login if relevant, and one deployment/admin event. Check FMC Analysis pages and SIEM ingestion.","Tune noise and dashboards."],
    ["Build operational views","Create filters or dashboards for top denies, IPS hits, malware, URL blocks, VPN logins, admin changes, and failed deployments.","Review daily during operations."]
  ])+cmdBlock(commandSets.logging)},
  {title:"Day-to-day change workflow",body:runbook("Professional change workflow",[
    ["Intake the request","Record requester, business owner, source, destination, port, app, reason, expiry, risk, and maintenance window. Reject vague requests like allow server to network.","Design the exact config."],
    ["Prepare objects and rule plan","Create or reuse objects, decide zones, NAT, route, access rule position, logging, inspection, and validation traffic. Write rollback before deployment.","Build in FMC/FDM."],

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function sentenceParts(raw){
  const s=String(raw).replace(/\s+/g," ").trim();
  return s.split(/(?<=[.;])\s+/).map(x=>x.trim()).filter(Boolean);
}
function stepTitle(raw){
  const s=String(raw).replace(/\s+/g," ").trim();
  const colon=s.indexOf(":");
  let t=colon>0&&colon<70?s.slice(0,colon):sentenceParts(s)[0]||s;
  t=t.replace(/[.;]$/,"");
  return t.length>78?t.slice(0,75)+"...":t;
}
function stepDetail(raw){
  const s=String(raw).replace(/\s+/g," ").trim();
  const colon=s.indexOf(":");
  if(colon>0&&colon<70) return s.slice(colon+1).trim()||s;
  const parts=sentenceParts(s);
  if(parts.length>1) return parts.slice(1).join(" ");
  return s;
}
function stepWhere(raw){
  const s=String(raw).toLowerCase();
  if(s.includes("fmc")||s.includes("devices >")||s.includes("policies >")||s.includes("analysis >")) return "FMC GUI: use the menu path shown in the step.";
  if(s.includes("fdm")||s.includes("device >")||s.includes("monitoring")) return "FDM GUI: use the local firewall web UI.";
  if(s.includes("packet-tracer")||s.includes("capture")||s.includes("asp drop")||s.includes("xlate")||s.includes("show conn")) return "Diagnostic CLI: from FTD CLI type system support diagnostic-cli.";
  if(s.includes("configure manager")||s.includes("configure network")||s.includes("show managers")||s.includes("show network")) return "FTD CLI: console or SSH to the firewall management IP.";
  if(s.includes("api")) return "FMC REST API: HTTPS to FMC /api endpoints with an API account.";
  if(s.includes("intrusion")||s.includes("ips")||s.includes("snort")) return "FMC GUI: Policies > Access Control and Policies > Intrusion.";
  if(s.includes("url")) return "FMC GUI: Policies > Access Control, then URL tab/condition on the rule.";
  if(s.includes("file")||s.includes("malware")) return "FMC GUI: Policies > Access Control plus Policies > File.";
  if(s.includes("tls")||s.includes("decrypt")||s.includes("certificate")||s.includes("ca ")) return "FMC GUI: Devices/Objects for certificates and Policies for SSL/TLS handling.";
  if(s.includes("identity")||s.includes("user")||s.includes("ise")||s.includes("realm")||s.includes("duo")||s.includes("mfa")) return "FMC GUI: Integration/Identity settings, then Policies > Access Control.";
  if(s.includes("interface")||s.includes("zone")||s.includes("vlan")||s.includes("port-channel")) return "FMC GUI: Devices > Device Management > edit device > Interfaces.";
  if(s.includes("route")||s.includes("gateway")||s.includes("ospf")||s.includes("bgp")) return "FMC GUI: Devices > Device Management > edit device > Routing.";
  if(s.includes("nat")||s.includes("pat")||s.includes("translated")) return "FMC GUI: Devices > NAT or Policies > NAT, depending on version/management.";
  if(s.includes("vpn")||s.includes("ike")||s.includes("ipsec")||s.includes("anyconnect")||s.includes("remote access")) return "FMC GUI: Devices > VPN for site-to-site or Remote Access VPN policy.";
  if(s.includes("backup")||s.includes("upgrade")) return "FMC GUI: System > Tools/Updates/Backup, plus device Health Monitor.";
  if(s.includes("log")||s.includes("event")||s.includes("siem")||s.includes("syslog")||s.includes("splunk")) return "FMC GUI: Analysis pages and Platform Settings > Syslog.";
  if(s.includes("ha")||s.includes("failover")||s.includes("cluster")) return "FMC GUI: Devices > Device Management > High Availability/Cluster, plus CLI verification.";
  return "Use the tab's topic area: FMC/FDM for configuration, CLI for proof and troubleshooting.";
}
function stepHow(raw){
  const s=String(raw).toLowerCase();
  if(s.includes("console cable")||s.includes("management cable")) return "Connect console to the appliance console port and management Ethernet to the management switch. Open a terminal at the device's required serial settings, log in, then cable inside/outside only after the management plan is recorded.";
  if(s.includes("model")||s.includes("serial")||s.includes("software version")) return "Run show version and show inventory, then write down model, serial number, FTD/FMC version, licenses, management IP, gateway, DNS, NTP, and intended inside/outside/DMZ interfaces.";
  if(s.includes("management ip")||s.includes("dns")||s.includes("ntp")||s.includes("hostname")) return "In FTD CLI use configure network for management IP/gateway, configure manager for FMC registration, and set DNS/NTP in the platform or FMC device settings. Use real NTP because certificates, identity, and events depend on correct time.";
  if(s.includes("add fmc manager")||s.includes("registration key")) return "On the firewall run configure manager add <fmc-ip> <registration-key>. In FMC open Devices > Device Management > Add Device, enter the firewall management IP and the same key, then select license and initial access policy.";
  if(s.includes("complete setup wizard")) return "In FDM browse to https://<management-ip>, set admin password, management services, time/DNS, outside and inside interface IPs, default route, licensing, then finish the wizard and deploy.";
  if(s.includes("interface")||s.includes("zone")||s.includes("vlan")) return "Edit the interface, enable it, set nameif/name, IP or DHCP/static value, VLAN tag if subinterface, security zone, and standby IP for HA if used. On the switch, match access/trunk VLAN and speed/duplex.";
  if(s.includes("port-channel")||s.includes("lacp")) return "Create the port-channel on both switch and firewall, add the same member ports, use LACP active/passive consistently, then put VLANs or routed IP on the bundle, not on individual members.";
  if(s.includes("mtu")||s.includes("fragmentation")) return "Find the smallest path MTU with DF-bit tests from an endpoint, account for VPN/cloud overhead, then change MTU or TCP MSS only for the affected path during a window.";
  if(s.includes("default route")) return "Add 0.0.0.0/0 toward the ISP/upstream next hop on the outside interface. Then add more-specific internal routes toward the core for RFC1918 or server networks.";
  if(s.includes("ospf")) return "Create OSPF process, set router ID, add networks/interfaces, choose area, mark non-neighbor interfaces passive, then filter/summarize only after neighbors and routes are stable.";
  if(s.includes("bgp")) return "Set local ASN, neighbor IP/remote ASN, update-source if needed, prefix lists, route maps, and advertised networks. Never enable broad redistribution until received and advertised routes are reviewed.";
  if(s.includes("multicast")) return "Identify source, receivers, group, RP/PIM design, TTL, and zones. Enable only the needed multicast handling and test one source-to-receiver flow in a lab first.";
  if(s.includes("objects")||s.includes("object names")||s.includes("duplicate objects")) return "Create Objects for networks, hosts, ports, URLs, and groups using a naming standard such as NET_, HOST_, SVC_, GRP_. Search before creating, add descriptions, and reuse existing objects.";
  if(s.includes("internet access")||s.includes("dynamic pat")) return "Create Auto NAT or Manual NAT from inside zone/source network to outside interface using interface PAT. Add an access rule from inside to outside for required services and enable logging.";
  if(s.includes("dmz server")||s.includes("static nat")||s.includes("published server")) return "Create static NAT from public IP to private DMZ host, then create outside-to-DMZ access rule for only the required port, for example TCP/443 to the real server.";
  if(s.includes("vpn nat exemption")||s.includes("nat exemption")) return "Create identity/no-NAT rule for local protected network to remote protected network and place it above generic internet PAT. Use original source/destination, not translated public IPs.";
  if(s.includes("ike")||s.includes("ipsec")||s.includes("site-to-site")) return "Create site-to-site VPN with peer public IP, IKE version, encryption/integrity/DH/lifetime, IPsec proposal/PFS, local and remote protected networks, NAT exemption, and route to the peer or remote networks.";
  if(s.includes("remote access")||s.includes("anyconnect")||s.includes("address pool")||s.includes("split tunnel")) return "Create Remote Access VPN policy with outside interface, certificate, AAA/MFA source, VPN pool, group policy, DNS servers, split-tunnel ACL, and access rules from VPN pool to internal apps.";
  if(s.includes("certificate")||s.includes("internal ca")||s.includes("trust")) return "Generate CSR or import certificate with private key, assign it to VPN/TLS feature, import trusted CA chain, check expiry/subject/SAN, and confirm clients trust the issuing CA.";
  if(s.includes("intrusion")||s.includes("ips")||s.includes("snort")) return "Attach an intrusion policy to a specific access rule, start with Balanced Security and Connectivity or monitor-only, deploy, generate test traffic, then tune one rule/event with a narrow exception.";
  if(s.includes("url")) return "Edit the web access rule, add URL category/reputation conditions, enable logging, start with monitor or block high-risk categories, deploy, browse test sites, then check category/action in events.";
  if(s.includes("file policy")||s.includes("file inspection")||s.includes("malware")) return "Create a File Policy, select protocols and file types, use detect before block, attach it to an access rule, deploy, transfer a safe test file, then review filename/SHA/disposition/action.";
  if(s.includes("tls")||s.includes("decrypt")) return "Create/import CA, deploy trust to pilot endpoints, define bypass categories and pinned/critical apps, apply TLS policy only to pilot users, then watch decrypt errors and CPU before expanding.";
  if(s.includes("identity")||s.includes("user-based")||s.includes("user is mapped")||s.includes("ise")||s.includes("sgt")) return "Integrate AD/ISE/VPN identity source, verify time sync, confirm user-to-IP mapping, then create one user/group rule above broad network rules and enable logging.";
  if(s.includes("mfa")||s.includes("duo")) return "Integrate Duo/MFA with the VPN authentication flow, choose push/passcode/token behavior, define timeout/fail behavior, create break-glass accounts, and test enrollment plus lost-device recovery.";
  if(s.includes("syslog")||s.includes("siem")||s.includes("splunk")) return "Configure syslog destination, facility, severity, timestamp, and hostname. Send connection, intrusion, VPN, deployment, and admin events, then normalize fields in SIEM dashboards.";
  if(s.includes("backup")||s.includes("export")) return "In FMC run a backup before changes, export device/config data where available, download or store it off-box, label it with device/version/date, and record restore location.";
  if(s.includes("upgrade")) return "Read release notes, confirm upgrade path and model compatibility, run health checks, clear failed deployments, back up FMC, upgrade in the supported order, and validate critical apps after each device.";
  if(s.includes("rollback")||s.includes("revert")) return "Before change, write exact rollback trigger, previous image/config location, commands or GUI steps to revert, expected outage time, and who decides to stop or continue.";
  if(s.includes("api")) return "Authenticate to FMC API, get domain UUID, list devices/objects/policies first with GET, save object UUIDs, and use POST/PUT only after a dry-run review and approval.";
  if(s.includes("deploy")) return "Open Deploy, review pending changes by device and policy, confirm rule order/object changes, check the maintenance window, deploy, then immediately test traffic and events.";
  if(s.includes("packet-tracer")) return "Run packet-tracer input <interface> <protocol> <src-ip> <src-port> <dst-ip> <dst-port> detailed and read each phase: route lookup, NAT, access control, inspection, and final action.";
  if(s.includes("capture")) return "Create a narrow capture filter for one source, destination, and port. Start capture, reproduce the issue once, stop capture, download/read packets, then remove the capture.";
  if(s.includes("failover")||s.includes("standby")||s.includes("ha")) return "Check both units with show failover, show interface ip brief, show route, show conn count, and FMC health. Only force failover after confirming the standby unit is healthy.";
  if(s.includes("cluster")) return "Confirm platform support, control link, data interfaces, switch design, traffic symmetry, NAT/VPN limitations, and upgrade process before enabling cluster.";
  if(s.includes("health")||s.includes("cpu")||s.includes("memory")||s.includes("snort statistics")) return "Use FMC Health Monitor plus CLI commands show cpu, show memory, show conn count, show interface, show asp drop, and show snort statistics. Compare with the time of the reported issue.";
  if(s.includes("five-tuple")||s.includes("symptom")) return "Write source IP, destination IP, protocol, source port, destination port, user, time, and application. Without this, packet-tracer, events, and captures cannot be trusted.";
  if(s.includes("public dns")) return "Resolve the public FQDN from outside, confirm it points to the NAT public IP, then test the exact service port from an external source.";
  if(s.includes("return path")) return "From the destination side, confirm its default gateway or route sends replies back through the firewall path. Asymmetric return traffic makes policy and NAT look broken.";
  return "Turn the sentence into values: identify the source, destination, zone, interface, IP/subnet, port, rule name, owner, and test traffic. Configure those values in FMC/FDM, deploy if needed, then prove with CLI/events.";
}
function stepVerify(raw){
  const s=String(raw).toLowerCase();
  if(s.includes("packet-tracer")) return "Packet-tracer should show the expected input interface, route, NAT, access rule, inspection phase, and final allow/drop result.";
  if(s.includes("interface")||s.includes("vlan")) return "Check link state, interface counters, ARP, route visibility, and FMC device health.";
  if(s.includes("route")||s.includes("ospf")||s.includes("bgp")) return "Use route lookup, neighbor status, and a return-path test from the destination side.";
  if(s.includes("nat")||s.includes("pat")) return "Use packet-tracer, show nat, show xlate, and connection events to confirm the correct translation.";
  if(s.includes("vpn")||s.includes("anyconnect")||s.includes("ike")||s.includes("ipsec")) return "Check VPN session/IKE/IPsec counters, NAT exemption, route, and one real application test through the tunnel.";
  if(s.includes("policy")||s.includes("rule")||s.includes("access")) return "Use FMC/FDM connection events to confirm the exact rule name, action, zones, ports, user/app, and logging.";
  if(s.includes("deploy")) return "Confirm deployment completes successfully, then test real traffic and check events for the expected rule/action.";
  if(s.includes("backup")||s.includes("export")) return "Confirm the backup/export exists outside the firewall and that the restore owner/location is documented.";
  if(s.includes("log")||s.includes("event")||s.includes("monitor")) return "Confirm the event appears with correct timestamp, hostname, source, destination, rule, and action.";
  if(s.includes("ha")||s.includes("failover")||s.includes("cluster")) return "Confirm active/standby or cluster health, monitored interfaces, state link, and critical traffic after the change.";
  return "Collect one proof point: command output, screenshot, event record, or successful application test.";
}
function stepNext(i,total){
  if(i+1>=total) return "Finish by recording the result, saved evidence, rollback status, and any follow-up cleanup.";
  return "Continue to step "+(i+2)+" only after the verification is clean.";
}
function steps(items){
  return `<div class="flow">${items.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div><div class="run-title">${esc(stepTitle(x))}</div><div class="run-do">${esc(stepDetail(x))}</div><div class="run-next"><b>Where:</b> ${esc(stepWhere(x))}<br><b>How:</b> ${esc(stepHow(x))}<br><b>Verify:</b> ${esc(stepVerify(x))}<br><b>Next:</b> ${esc(stepNext(i,items.length))}</div></div></div>`).join("")}</div>`;
}
function runbook(title,items){return `<div class="cblock"><div class="chdr"><div class="chdr-l">${esc(title)}</div><span class="badge caution">ordered</span></div><div class="cbody"><div class="flow">${items.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div><div class="run-title">${esc(x[0])}</div><div class="run-do">${esc(x[1])}</div><div class="run-next"><b>Next:</b> ${esc(x[2])}</div></div></div>`).join("")}</div></div></div>`;}
function table(head,rows){return `<div class="cblock"><div class="cbody" style="padding:0"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;}
function cliMode(cmd){
  const c=String(cmd).trim();
  if(/^(GET|POST|PUT|DELETE)\s+\/api\//.test(c)) return "FMC REST API, not firewall CLI";
  if(c==="expert") return "FTD CLI: type this to enter Expert shell";
  if(/^(sudo |df -h$|top$)/.test(c)) return "Expert shell (Linux): enter from FTD CLI with expert";
  if(c==="system support diagnostic-cli") return "FTD CLI: enters Diagnostic CLI";
  if(/^(configure network|configure manager|configure factory-reset|show managers|show network|show ntp|show dns|show time|show disk)/.test(c)) return "FTD CLI";
  if(/^(packet-tracer|capture |no capture|clear conn|clear xlate|clear crypto|vpn-sessiondb|failover |no failover|show asp|show access-list|show nat|show xlate|show conn|show crypto|show vpn-sessiondb|show failover|show ospf|show bgp|show arp|show route|show running-config|show access-control-config|show snort|show port-channel|show lacp|show chassis|show environment|show resource)/.test(c)) return "Diagnostic CLI (ASA/LINA): from FTD CLI run system support diagnostic-cli";
  if(/^(show interface|show cpu|show memory|show logging|show inventory|show version)/.test(c)) return "FTD CLI; also commonly available in Diagnostic CLI";
  if(/^(reboot|shutdown|clear configure all)/.test(c)) return "Confirm current CLI context first; disruptive command";
  return "Confirm CLI mode for your FTD/FMC version";
}
function cmdBlock(cmds){
  return `<div class="cblock"><div class="chdr"><div class="chdr-l">Commands</div><button class="copybtn" onclick="copyBlock(this)">Copy all</button></div><div class="cbody">${cmds.map(([s,c,w,m])=>`<div class="cmdrow" data-copy="${esc(c)}"><div><div class="cmd ${s}">${esc(c)}</div><div class="mode">Mode: ${esc(m||cliMode(c))}</div><div class="why">${esc(w||"")}</div></div><div><span class="badge ${s}">${s==="ro"?"GREEN":s==="caution"?"YELLOW":"RED"}</span> <button class="copybtn" onclick="copyOne(this)">Copy</button></div></div>`).join("")}</div></div>`;
}
function refBundles(bundles){
  return `<div class="note"><b>Quick Reference is bundled.</b> Click a category to open only the commands you need. Each command still shows safety color and CLI mode.</div><div class="quick-grid">${bundles.map(([title,desc,cmds],i)=>`<div class="quick-card cblock ${i===0?"open":""}"><button class="quick-head" onclick="toggleQuick(this)"><div><div class="quick-title">${esc(title)}</div><div class="quick-desc">${esc(desc)}</div></div><div class="quick-meta"><span class="badge ro">${cmds.length} cmds</span><span class="copybtn" onclick="event.stopPropagation();copyBlock(this)">Copy all</span></div></button><div class="quick-body">${cmds.map(([s,c,w,m])=>`<div class="cmdrow" data-copy="${esc(c)}"><div><div class="cmd ${s}">${esc(c)}</div><div class="mode">Mode: ${esc(m||cliMode(c))}</div><div class="why">${esc(w||"")}</div></div><div><span class="badge ${s}">${s==="ro"?"GREEN":s==="caution"?"YELLOW":"RED"}</span> <button class="copybtn" onclick="copyOne(this)">Copy</button></div></div>`).join("")}</div></div>`).join("")}</div>`;
}
function toggleQuick(btn){btn.closest(".quick-card").classList.toggle("open");}
function renderSidebar(){
  const sb=document.getElementById("sidebar");let last="",h="";
  modules.forEach(m=>{if(m.group!==last){last=m.group;h+=`<div class="slbl">${m.group}</div>`}h+=`<button class="cb ${m.id===current?"active":""}" onclick="openModule('${m.id}',0)"><span class="ic">${m.icon}</span>${m.title}</button>`});
  sb.innerHTML=h;
}
function renderTabs(){
  const m=modules.find(x=>x.id===current);
  document.getElementById("tabs").innerHTML=m.tabs.map((t,i)=>`<button class="tab ${i===tab?"active":""}" onclick="openModule('${current}',${i})">${esc(t)}</button>`).join("");
}
function renderContent(){
  const m=modules.find(x=>x.id===current), item=content[current][tab]||content[current][0];
  document.getElementById("content").innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px"><div><div class="stitle">${esc(m.title)} - ${esc(item.title)}</div><div class="small">Use the sidebar for modules and tabs for focused subtopics.</div></div><span class="badge ro">toolkit</span></div>${item.body}`;
}
function openModule(id,t){current=id;tab=t||0;renderSidebar();renderTabs();renderContent();document.getElementById("search").value="";}
function copyText(text,btn){navigator.clipboard.writeText(text).then(()=>{const old=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=old,900);});}
function copyOne(btn){const row=btn.closest(".cmdrow");copyText(row.dataset.copy,btn);}
function copyBlock(btn){const block=btn.closest(".cblock");const lines=[...block.querySelectorAll(".cmdrow")].map(r=>r.dataset.copy).join("\n");copyText(lines,btn);}
function runSearch(q){
  q=q.trim().toLowerCase(); if(!q){renderContent();return;}
  const all=[];
  Object.keys(content).forEach(id=>content[id].forEach((it,i)=>{const plain=(modules.find(m=>m.id===id).title+" "+it.title+" "+it.body).replace(/<[^>]+>/g," "); if(plain.toLowerCase().includes(q))all.push({id,i,title:modules.find(m=>m.id===id).title+" - "+it.title});}));
  document.getElementById("content").innerHTML=`<div class="cblock"><div class="chdr"><div class="chdr-l">Search results</div><span class="badge ro">${all.length} found</span></div><div class="cbody">${all.length?all.map(r=>`<button class="cb" style="border:1px solid var(--br);margin-bottom:7px;background:var(--b2)" onclick="openModule('${r.id}',${r.i})">${esc(r.title)}</button>`).join(""):"No matching module found."}</div></div>`;
}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==="light"?"dark":"light";}
renderSidebar();renderTabs();renderContent();
</script>
</body>
</html>
